name: CD

# Runs only after the CI workflow finishes on `main`, and only if it succeeded. Publishing is safe
# here because workflow_run always runs from the default branch's workflow file, and we skip CI runs
# that were not a push (so pull requests and forks, even from a branch named `main`, never publish).
# Manual runs are limited to `main` as well.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deliver:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The ML steps below must stay in sync with the `ml-validation-and-docker` job in ci.yml, so the
    # published image is built exactly the way CI validated it.
    # No DVC, real dataset or remote: training uses the small fixture CSV and a throwaway MLflow store.
    env:
      HOTELPRICE_DATA_PATH: tests/fixtures/hotel_sample.csv
      HOTELPRICE_MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      HOTELPRICE_MODEL_DIR: ${{ github.workspace }}/ci-models
      # The exact commit CI validated (a manual run uses the commit it was started on).
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"

      - name: Train on the fixture
        run: python -m hotelprice.train
      - name: Check metrics
        run: |
          python -c "
          import json, math, os
          m = json.load(open(os.path.join(os.environ['HOTELPRICE_MODEL_DIR'], 'metrics.json')))
          assert all(math.isfinite(m[k]) for k in ('mae', 'rmse', 'r2')), m
          print(m)
          "

      - name: Set champion alias
        run: python -m hotelprice.select_model
      - name: Export serving artifacts
        run: python -m hotelprice.export_artifacts

      - name: Build Docker image
        run: |
          # Registries reject uppercase names, so lowercase the owner/repo.
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${repo}-service:${COMMIT_SHA}" >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --label "org.opencontainers.image.description=Contains a model trained on the CI fixture dataset (tests/fixtures/hotel_sample.csv, 300 rows), not the real dataset" \
            -t "ghcr.io/${repo}-service:${COMMIT_SHA}" .

      - name: Container smoke test
        run: |
          set -euo pipefail
          docker run -d --name hotel-price-cd -p 3000:3000 "$IMAGE"
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs hotel-price-cd; fi; docker rm -f hotel-price-cd' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/readyz > /dev/null; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo "Service did not become ready"; exit 1; }

          # Valid request: the first fixture row without the target column.
          row=$(python -c "
          import json, pandas as pd
          df = pd.read_csv('tests/fixtures/hotel_sample.csv')
          print(json.dumps(df.drop(columns='room_price').iloc[0].to_dict()))
          ")
          curl -fs -X POST http://localhost:3000/predict -H 'Content-Type: application/json' -d "$row" \
            | python -c "
          import json, math, sys
          p = json.load(sys.stdin)['predicted_room_price']
          assert isinstance(p, float) and math.isfinite(p), p
          print('prediction:', p)
          "

          # Invalid request (missing fields) must be rejected with a 4xx status.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/predict \
            -H 'Content-Type: application/json' -d '{"hotel": "Taj"}')
          echo "invalid request status: $code"
          [[ "$code" == 4* ]] || { echo "Expected a 4xx status"; exit 1; }

      # Only reached if the smoke test passed: a failed step stops the job before the push.
      - name: Push image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          echo "Published image: $IMAGE"
          {
            echo "### Published image"
            echo
            echo "\`$IMAGE\`"
            echo
            echo "Contains a model trained on the CI fixture dataset (not the real dataset)."
            echo
            echo '```bash'
            echo "docker pull $IMAGE"
            echo "docker run --rm -p 3000:3000 $IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
